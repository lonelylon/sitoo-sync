# Klistra in den här filen i Container Station under Applikationer > Skapa.
# Inställningarna görs sedan i webbläsaren på http://<QNAP-IP>:8095
services:
  sitoo-sync:
    image: ghcr.io/lonelylon/sitoo-sync:latest
    container_name: sitoo-sync
    restart: unless-stopped
    ports:
      - "8095:8080"
    volumes:
      - sitoo-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sitoo-data:
